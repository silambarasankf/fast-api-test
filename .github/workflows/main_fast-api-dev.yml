name: Azure Web App Slot Deployment

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      skip_health_check:
        description: 'Skip health check'
        required: false
        type: boolean
        default: false

# env:
#   AZURE_WEBAPP_NAME: 'your-webapp-name'      # Your Azure Web App name
#   AZURE_RESOURCE_GROUP: 'your-resource-group'       # Your Azure Resource Group
#   AZURE_WEBAPP_SLOT_NAME: 'staging'                        # Staging slot name
#   SLOT_HEALTH_CHECK_URL: 'https://your-webapp-name-staging.azurewebsites.net/health'

jobs:
  build:
    name: 🔨 Build Application
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: webapp-package
          path: |
            app/
            requirements.txt
          retention-days: 1

  deploy-to-staging-slot:
    name: 🚀 Deploy to Staging Slot
    runs-on: ubuntu-latest
    needs: build
    environment: staging
    
    steps:
      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: webapp-package
          path: ./package

      - name: Login to Azure
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Deploy to Staging Slot
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ vars.AZURE_WEBAPP_NAME }}
          slot-name: ${{ vars.AZURE_WEBAPP_SLOT_NAME }}
          package: ./package

      - name: Logout from Azure
        run: az logout

  health-check:
    name: 🏥 Health Check - Staging
    runs-on: ubuntu-latest
    needs: deploy-to-staging-slot
    if: ${{ github.event.inputs.skip_health_check != 'true' }}
    
    steps:
      - name: Wait for application warmup
        run: sleep 30

      - name: Health Check - Staging Slot
        id: health_check
        run: |
          echo "Checking health at: ${{ vars.SLOT_HEALTH_CHECK_URL }}"
          
          MAX_RETRIES=5
          RETRY_COUNT=0
          HEALTH_STATUS="unhealthy"
          
          while [ $RETRY_COUNT -lt $MAX_RETRIES ]; do
            HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" "${{ vars.SLOT_HEALTH_CHECK_URL }}" || echo "000")
            
            echo "Attempt $((RETRY_COUNT + 1)): HTTP Status = $HTTP_STATUS"
            
            if [ "$HTTP_STATUS" -eq 200 ]; then
              HEALTH_STATUS="healthy"
              echo "✅ Health check passed!"
              break
            fi
            
            RETRY_COUNT=$((RETRY_COUNT + 1))
            if [ $RETRY_COUNT -lt $MAX_RETRIES ]; then
              echo "Retrying in 15 seconds..."
              sleep 15
            fi
          done
          
          echo "health_status=$HEALTH_STATUS" >> $GITHUB_OUTPUT
          
          if [ "$HEALTH_STATUS" != "healthy" ]; then
            echo "❌ Health check failed after $MAX_RETRIES attempts"
            exit 1
          fi

      - name: Post health check summary
        run: |
          echo "## 🏥 Health Check Summary" >> $GITHUB_STEP_SUMMARY
          echo "| Item | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|------|-------|" >> $GITHUB_STEP_SUMMARY
          echo "| Staging URL | ${{ vars.SLOT_HEALTH_CHECK_URL }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Status | ✅ Healthy |" >> $GITHUB_STEP_SUMMARY

  manual-approval:
    name: Manual Approval Required
    runs-on: ubuntu-latest
    needs: health-check
    environment:
      name: production-approval
    
    steps:
      - name: Approval checkpoint
        run: |
          echo "## ✅ Manual Approval Received" >> $GITHUB_STEP_SUMMARY
          echo "Approved by: ${{ github.actor }}" >> $GITHUB_STEP_SUMMARY
          echo "Proceeding with slot swap..."

  slot-swap:
    name: 🔄 Swap Slots - Production Deploy
    runs-on: ubuntu-latest
    needs: manual-approval
    environment:
      name: production
    
    steps:
      - name: Login to Azure
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Swap Staging to Production
        run: |
          echo "🔄 Initiating slot swap..."
          az webapp deployment slot swap \
            --resource-group ${{ vars.AZURE_RESOURCE_GROUP }} \
            --name ${{ vars.AZURE_WEBAPP_NAME }} \
            --slot ${{ vars.AZURE_WEBAPP_SLOT_NAME }} \
            --target-slot production
          
          echo "✅ Slot swap completed successfully!"

      - name: Verify Production Health
        run: |
          echo "Verifying production health..."
          sleep 10
          
          HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" "${{ vars.PROD_HEALTH_CHECK_URL }}" || echo "000")
          
          if [ "$HTTP_STATUS" -eq 200 ]; then
            echo "✅ Production is healthy!"
          else
            echo "⚠️ Production health check returned: $HTTP_STATUS"
          fi

      - name: Post deployment summary
        run: |
          echo "## 🎉 Deployment Summary" >> $GITHUB_STEP_SUMMARY
          echo "| Item | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|------|-------|" >> $GITHUB_STEP_SUMMARY
          echo "| Web App | ${{ vars.AZURE_WEBAPP_NAME }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Production URL | "${{ vars.PROD_HEALTH_CHECK_URL }}" |" >> $GITHUB_STEP_SUMMARY
          echo "| Deployed By | ${{ github.actor }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Commit | ${{ github.sha }} |" >> $GITHUB_STEP_SUMMARY

      - name: Logout from Azure
        run: az logout
