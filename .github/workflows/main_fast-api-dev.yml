name: Deploy FastAPI to Azure App Service

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    # Create upload folder with ONLY the files App Service must build
    - name: Prepare deployment package
      run: |
        mkdir -p upload
        cp -r app upload/app
        cp requirements.txt upload/
        cp startup.sh upload/
        chmod +x upload/startup.sh

    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: fastapi-app
        path: upload/

  deploy:
    runs-on: ubuntu-latest
    needs: build

    steps:
    - name: Download artifact
      uses: actions/download-artifact@v4
      with:
        name: fastapi-app
        path: upload/

    - name: Deploy to Azure App Service
      uses: azure/webapps-deploy@v3
      with:
        app-name: fast-api-dev
        publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
        package: upload/
